services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: erturk-lab-web-dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
