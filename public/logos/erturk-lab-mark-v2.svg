<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Ertürk Lab — whole-body imaging & AI">
  <defs>
    <linearGradient id="bio" x1="12" y1="48" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.45" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="vessel" x1="32" y1="18" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="0.55" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- DISCO clearing layers -->
  <g opacity="0.22" stroke="url(#bio)" stroke-width="1.1" fill="none">
    <path d="M18 34c0-9 6.5-15 14-15s14 6 14 15c0 2.5-1 5-3 7.5l-5 6.5c-1.2 1.5-3 2.5-6 2.5s-4.8-1-6-2.5l-5-6.5c-2-2.5-3-5-3-7.5Z" transform="translate(-1.2 -0.8)"/>
    <path d="M18 34c0-9 6.5-15 14-15s14 6 14 15c0 2.5-1 5-3 7.5l-5 6.5c-1.2 1.5-3 2.5-6 2.5s-4.8-1-6-2.5l-5-6.5c-2-2.5-3-5-3-7.5Z" transform="translate(1.2 0.8)"/>
  </g>

  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Light-sheet plane -->
  <path d="M8 32 H56" stroke="#34D399" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>
  <path d="M8 32 H56" stroke="#C026D3" stroke-width="0.75" stroke-linecap="round" opacity="0.2" transform="translate(0 2)"/>

  <!-- Whole-body silhouette (dorsal mouse) -->
  <path
    d="M18 34c0-9 6.5-15 14-15 2.8 0 5.2 1 7 2.6 1.2-2.2 3.4-3.6 6-3.6 7.5 0 14 6 14 15 0 2.5-1 5-3 7.5l-5 6.5c-1.2 1.5-3 2.5-6 2.5s-4.8-1-6-2.5l-5-6.5c-2-2.5-3-5-3-7.5Z"
    stroke="url(#bio)"
    stroke-width="1.65"
    fill="rgba(52,211,153,0.06)"
    stroke-linejoin="round"
  />
  <!-- Ears -->
  <circle cx="24" cy="21" r="2.1" stroke="url(#bio)" stroke-width="1.2" fill="rgba(192,38,211,0.12)"/>
  <circle cx="40" cy="21" r="2.1" stroke="url(#bio)" stroke-width="1.2" fill="rgba(52,211,153,0.12)"/>
  <!-- Tail -->
  <path d="M46 36c5 1.5 9 0.5 11-2" stroke="url(#bio)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Vasculature tree (VesSAP-inspired) -->
  <g stroke="url(#vessel)" stroke-width="1.15" stroke-linecap="round" fill="none" filter="url(#soft)">
    <path d="M32 22 V40"/>
    <path d="M32 26 L26 30 M32 26 L38 30"/>
    <path d="M32 30 L27 34 M32 30 L37 34"/>
    <path d="M32 34 L28 38 M32 34 L36 38"/>
    <path d="M26 30 L24 33 M38 30 L40 33"/>
  </g>

  <!-- AI graph nodes -->
  <g>
    <circle cx="32" cy="22" r="1.55" fill="#FDE047"/>
    <circle cx="26" cy="30" r="1.35" fill="#34D399"/>
    <circle cx="38" cy="30" r="1.35" fill="#34D399"/>
    <circle cx="28" cy="38" r="1.25" fill="#F472B6"/>
    <circle cx="36" cy="38" r="1.25" fill="#F472B6"/>
    <circle cx="32" cy="34" r="1.45" fill="#C026D3"/>
    <path d="M32 23.6 L26 28.7 M32 23.6 L38 28.7 M26 31.3 L28 36.8 M38 31.3 L36 36.8 M32 35.5 L32 40" stroke="#A855F7" stroke-width="0.65" opacity="0.75"/>
  </g>
</svg>
